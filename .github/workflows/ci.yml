name: 🧪 Continuous Integration

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_PORTFOLIO_URL: ${{ vars.PUBLIC_PORTFOLIO_URL }}
  PUBLIC_DOCUMENTATION_URL: ${{ vars.PUBLIC_DOCUMENTATION_URL }}

jobs:
  validate:
    name: 🧪 Validate Astro gateway
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 📦 Enable pnpm
        run: corepack enable
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ✅ Validate homepage
        run: pnpm validate

      - name: Install browser for public CMS fixture proof
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify pinned public CMS builds offline
        run: pnpm test:cms

  pages-tool:
    name: Validate optional Pages staging tool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/pages-tool
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: scripts/pages-tool/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
