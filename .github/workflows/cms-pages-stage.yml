# Opt-in artifact staging only: no Pages deployment permission.
name: Stage exact CMS Pages artifact (no deployment)
run-name: CMS Astro staging ${{ inputs.stage_id }}
on:
  workflow_dispatch:
    inputs:
      stage_id:
        description: Fresh public staging request UUID
        required: true
        type: string
      request:
        description: Exact public astro-pages-stage-v1 JSON from the trusted local checker
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: astro-cms-pages-staging
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ vars.HOMEPAGE_CMS_STAGE_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cms-pages-staging
    env:
      CMS_STAGE_ENABLED: ${{ vars.HOMEPAGE_CMS_STAGE_ENABLED }}
      CMS_STAGE_ID: ${{ inputs.stage_id }}
      CMS_STAGE_REQUEST: ${{ inputs.request }}
      CMS_CANDIDATE_WORKFLOW_ID: ${{ vars.HOMEPAGE_CMS_CANDIDATE_WORKFLOW_ID }}
    steps:
      - name: Check correlation and reviewed code before checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          def unique(pairs):
              out = {}
              for k, v in pairs:
                  if k in out: raise ValueError()
                  out[k] = v
              return out
          try:
              raw = os.environ["CMS_STAGE_REQUEST"]
              if len(raw.encode("utf-8")) > 8192: raise ValueError()
              request = json.loads(raw, object_pairs_hook=unique)
              identity = os.environ["CMS_STAGE_ID"]
              if not re.fullmatch(r"[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}", identity): raise ValueError()
              if request["request_id"] != identity or request["head_sha"] != os.environ["GITHUB_SHA"]: raise ValueError()
              if os.environ["GITHUB_REF"] != "refs/heads/main" or os.environ["GITHUB_RUN_ATTEMPT"] != "1": raise ValueError()
          except Exception:
              raise SystemExit("PAGES_STAGE_UNVERIFIED")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: scripts/pages-tool/go.mod
          cache: false
      - name: Acquire and verify exact candidate TAR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/cms-pages-stage"
          go -C scripts/pages-tool run . stage --out "$RUNNER_TEMP/cms-pages-stage/artifact.tar"
      - name: Upload verified TAR without repacking site members
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astro-cms-pages-${{ inputs.stage_id }}
          path: ${{ runner.temp }}/cms-pages-stage/artifact.tar
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
