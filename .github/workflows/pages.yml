name: 🚀 Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PUBLIC_PORTFOLIO_URL: ${{ vars.PUBLIC_PORTFOLIO_URL }}
  PUBLIC_DOCUMENTATION_URL: ${{ vars.PUBLIC_DOCUMENTATION_URL }}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build Astro homepage
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 📦 Enable pnpm
        run: corepack enable
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build static homepage
        run: pnpm build
      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 🚀 Deploy homepage
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
